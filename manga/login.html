<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login</title>
<style>
  body{font-family:Helvetica,Arial;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
  .box{background:#222;padding:20px;border-radius:8px;width:320px}
  .box input{width:100%;padding:8px;margin:6px 0;border-radius:4px}
  .row{display:flex;gap:8px}
  .row button{flex:1;padding:8px}
</style>
</head>
<body>
  <div class="box">
    <h3>Entrar / Criar conta</h3>
    <input id="user" placeholder="usuário" />
    <input id="pass" type="password" placeholder="senha" />
    <div class="row">
      <button id="create">Criar</button>
      <button id="login">Entrar</button>
    </div>
    <div id="msg" style="margin-top:8px;min-height:18px"></div>
  </div>

<script>
function msg(t,c){var e=document.getElementById('msg');e.textContent=t;e.style.color=c||'#f88'}
function api(path,body){return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json())}

document.getElementById('create').onclick = function(){
  var u=document.getElementById('user').value.trim();
  var p=document.getElementById('pass').value;
  if(!u||!p){msg('preencha usuário e senha');return}
  api('/create',{username:u,password:p}).then(j=>{
    if(j.ok){msg('criado, faça login','lime')} else msg(j.detail||j.msg||'erro')
  }).catch(e=>msg('erro'))
}

document.getElementById('login').onclick = function(){
  var u=document.getElementById('user').value.trim();
  var p=document.getElementById('pass').value;
  if(!u||!p){msg('preencha usuário e senha');return}
  api('/login',{username:u,password:p}).then(j=>{
    if(j.ok && j.token){
      localStorage.setItem('manga_token', j.token);
      // volta para home
      window.location.href = '/';
    } else {
      msg(j.detail||'erro')
    }
  }).catch(e=>msg('erro'))
}
</script>
</body>
</html>
