<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Leitor de Imagens</title>

<style>
  html,body {
    margin:0; padding:0; background:#111; color:white;
    font-family:Helvetica,Arial;
    height:100%; overflow:hidden;
  }

  /* MENU CONFIG */
  #configMenu {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:#000d; display:flex; flex-direction:column;
    justify-content:center; align-items:center; z-index:999;
    backdrop-filter: blur(3px);
  }
  #configMenu input {
    margin:8px 0; padding:8px; width:80%; font-size:18px;
  }
  #closeConfigBtn {
    padding:10px 18px; font-size:18px; margin-top:10px;
  }
  #startBtn {
    padding:10px 18px; font-size:18px; margin-top:10px;
  }

  /* Botão reabrir menu */
  #menuBtn {
    position:fixed; left:10px; bottom:10px;
    padding:10px 14px; background:#444; 
    color:white; cursor:pointer; z-index:1000;
    border-radius:8px;
  }

  #container {
    display:flex; align-items:center; justify-content:center;
    height:100vh; position:relative;
    display:none;
  }

  #viewer {
    max-width:90%;
    max-height:80vh;
  }

  .zone {
    position:absolute; top:0; height:100%; width:40%; cursor:pointer;
  }
  #leftZone { left:0; }
  #rightZone { right:0; }

  #fsBtn {
    position:fixed; top:10px; right:10px; z-index:1000;
    padding:6px 10px; background:#333; color:white; display:none;
  }
  #myMangasList div.selected { background:#333; color:#fff }
</style>
</head>
<body>

<!-- MENU DE CONFIGURAÇÃO -->
<div id="configMenu">
  <h2>Configuração</h2>

  <input id="baseUrl" type="text" placeholder="URL base" value="https://mugiwarasoficial.com/manga/one-punch-man/">
  <input id="chapterNum" type="number" placeholder="Capítulo" value="213">
  <input id="mangaName" type="text" placeholder="Selecione um manga da lista" readonly>

  <div style="display:flex; gap:8px; width:80%; justify-content:center;">
    <button id="saveMangaBtn">Salvar Manga</button>
    <button id="listMangasBtn">Meus Mangas</button>
  </div>

  <div id="myMangasList" style="width:80%; max-height:200px; overflow:auto; margin-top:8px; border:1px solid #222; display:block"></div>

  <button id="startBtn">Iniciar Leitura</button>
  <button id="closeConfigBtn">Fechar</button>

</div>

<!-- Input oculto usado internamente -->
<input id="urlBox" type="text" style="display:none">

<button id="fsBtn">Tela cheia</button>
<button id="menuBtn">Configuração</button>

<!-- VISOR -->
<div id="container">
  <img id="viewer" src="" alt="Aguardando…" />
  <div id="leftZone" class="zone"></div>
  <div id="rightZone" class="zone"></div>
</div>


<script>
var images = [];
var index = 0;
var fullscreen = false;
var storageKey = 'mangaReaderState';
var savedIndexOnLoad = null;

function saveState() {
  try {
    var state = {
      baseUrl: document.getElementById("baseUrl").value.trim(),
      chapterNum: document.getElementById("chapterNum").value.trim(),
      index: index
    };
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (e) { }
}

function getStoredState() {
  try {
    var raw = localStorage.getItem(storageKey);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

// Carrega estado ao abrir a página (preenche inputs e prepara índice)
(function(){
  var s = getStoredState();
  if (s) {
    if (s.baseUrl) document.getElementById("baseUrl").value = s.baseUrl;
    if (s.chapterNum) document.getElementById("chapterNum").value = s.chapterNum;
    var b = document.getElementById("baseUrl").value.trim();
    if (b && !b.endsWith("/")) b += "/";
    document.getElementById("urlBox").value = b + 'capitulo-' + document.getElementById("chapterNum").value.trim();
    savedIndexOnLoad = s.index != null ? s.index : null;
  }
})();

// Se não logado, redireciona para /login
(function(){
  var token = localStorage.getItem('manga_token');
  if(!token){
    // allow the login page itself to load without redirect loops
    if(!location.pathname.startsWith('/login')) location.href = '/login';
  } else {
    // carrega a lista de mangas para exibir na configuração
    try{ loadMyMangas(); }catch(e){}
  }
})();

function loadMyMangas(){
  var token = localStorage.getItem('manga_token');
  if(!token) return;
  fetch('/manga/list?token=' + encodeURIComponent(token)).then(r=>r.json()).then(j=>{
    if(!j.ok) return;
    var list = j.mangas || [];
    var box = document.getElementById('myMangasList');
    if(!box) return;
    box.innerHTML = '';
    list.forEach(function(m){
      var el = document.createElement('div');
      el.style.padding='6px'; el.style.borderBottom='1px solid #333'; el.style.cursor='pointer';
      el.textContent = (m.name || m.url);
        el.onclick = function(){
          // remove seleção anterior
          var children = box.children;
          for(var i=0;i<children.length;i++){ children[i].classList.remove('selected') }
          this.classList.add('selected');

          document.getElementById('mangaName').value = m.name || '';
          document.getElementById('baseUrl').value = m.url || '';
          document.getElementById('chapterNum').value = m.chapter || '';
          savedIndexOnLoad = m.index != null ? m.index : null;

          // prepara URL de capítulo (se já for URL completa, usa ela)
          var u = m.url || '';
          if (!u.includes('capitulo-')) {
            var b = document.getElementById('baseUrl').value.trim(); if (!b.endsWith('/')) b += '/';
            u = b + 'capitulo-' + (m.chapter || '1');
          }
          document.getElementById('urlBox').value = u;

          // iniciar leitura no ponto salvo
          document.getElementById('configMenu').style.display = 'none';
          document.getElementById('container').style.display = 'flex';
          document.getElementById('fsBtn').style.display = 'block';
          saveState();
          loadChapter();
        };
      box.appendChild(el);
    });
  }).catch(e=>{});
}

/* ------------------------------
      FUNÇÃO DE EXTRAÇÃO
--------------------------------*/
function extractImagesFromHTML(html, baseURL) {
  var tmp = document.createElement("div");
  tmp.innerHTML = html;

  var list = tmp.querySelectorAll("img.wp-manga-chapter-img");
  var arr = [];

  var base = document.createElement("a");
  base.href = baseURL;

  for (var i = 0; i < list.length; i++) {
    var src =
      list[i].getAttribute("data-src") ||
      list[i].getAttribute("data-lazy-src") ||
      list[i].getAttribute("data-original") ||
      list[i].getAttribute("src");

    if (!src) continue;

    src = src.trim();

    if (src.startsWith("http")) {
      arr.push(src); continue;
    }
    if (src.startsWith("//")) {
      arr.push("https:" + src); continue;
    }
    if (src.startsWith("/")) {
      arr.push(base.protocol + "//" + base.host + src);
      continue;
    }

    arr.push(base.protocol + "//" + base.host + "/" + src);
  }

  return arr;
}

/* ------------------------------
          CARREGAR
--------------------------------*/
function loadChapter() {
  var url = document.getElementById("urlBox").value;

  var xhr = new XMLHttpRequest();
  xhr.open("GET", "/fetch?url=" + encodeURIComponent(url), true);

  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {

        var html = xhr.responseText;
        images = extractImagesFromHTML(html, url);

        if (images.length > 0) {
          // Se existe um índice salvo para este capítulo, usa ele
          if (savedIndexOnLoad !== null && !isNaN(savedIndexOnLoad)) {
            var s = parseInt(savedIndexOnLoad, 10) || 0;
            if (s >= 0 && s < images.length) index = s; else index = 0;
            savedIndexOnLoad = null;
          } else {
            index = 0;
          }
          document.getElementById("viewer").src = images[index];
          saveState();
        } else {
          document.getElementById("viewer").alt = "Nenhuma imagem encontrada.";
        }

      } else {
        document.getElementById("viewer").alt = "Erro ao carregar.";
      }
    }
  };

  xhr.send();
}

/* Navegação */
function showIndex(i) {
  if (!images.length) return;
  index = (i + images.length) % images.length;
  document.getElementById("viewer").src = images[index];
  saveState();
}

function nextImg() {
  if (!images.length) return;

  // Se ainda NÃO é a última imagem
  if (index < images.length - 1) {
    showIndex(index + 1);
    return;
  }

  // 👇 CHEGOU NA ÚLTIMA IMAGEM
  // Incrementa o capítulo
  let chapterInput = document.getElementById("chapterNum");
  let current = parseInt(chapterInput.value, 10) || 0;
  chapterInput.value = current + 1;

  // Gera nova URL
  let b = document.getElementById("baseUrl").value.trim();
  if (!b.endsWith("/")) b += "/";
  let finalURL = b + "capitulo-" + chapterInput.value;

  document.getElementById("urlBox").value = finalURL;

  // Recarrega o novo capítulo
  // reset index for new chapter and persist chapter change
  index = 0;
  saveState();
  loadChapter();
}


function prevImg() { showIndex(index - 1); }

document.getElementById("leftZone").onclick = prevImg;
document.getElementById("rightZone").onclick = nextImg;

// Salva quando os inputs mudam
document.getElementById("baseUrl").addEventListener('change', saveState);
document.getElementById("chapterNum").addEventListener('change', saveState);

/* Fullscreen */
document.getElementById("fsBtn").onclick = function() {
  var v = document.getElementById("viewer");
  if (!fullscreen) {
    fullscreen = true;
    this.innerHTML = "Sair";
    v.style.maxWidth = "100%";
    v.style.maxHeight = "100vh";
    document.body.style.background = "#fff";
    document.getElementById("container").style.background = "#fff";
  } else {
    fullscreen = false;
    this.innerHTML = "Tela cheia";
    v.style.maxWidth = "90%";
    v.style.maxHeight = "80vh";
    document.body.style.background = "#111";
    document.getElementById("container").style.background = "#111";
  }
};

/* -----------------------------------------
       MENU → GERA URL → SOME
------------------------------------------*/
document.getElementById("startBtn").onclick = function() {
  // exige token (usuário logado)
  var token = localStorage.getItem('manga_token');
  if (!token) {
    // tenta abrir o modal de login criado por auth.js
    var btn = document.getElementById('authOpenBtn');
    if (btn) btn.click(); else alert('Faça login antes de usar o leitor.');
    return;
  }

  let b = document.getElementById("baseUrl").value.trim();
  let c = document.getElementById("chapterNum").value.trim();

  if (!b.endsWith("/")) b += "/";
  let finalURL = b +'capitulo-'+ c ;

  document.getElementById("urlBox").value = finalURL;

  document.getElementById("configMenu").style.display = "none";
  document.getElementById("container").style.display = "flex";
  document.getElementById("fsBtn").style.display = "block";

  // Se existe estado salvo e corresponde ao capítulo atual, restaura índice
  var stored = getStoredState();
  if (stored && stored.baseUrl === document.getElementById("baseUrl").value.trim() && String(stored.chapterNum) === String(document.getElementById("chapterNum").value.trim())) {
    savedIndexOnLoad = stored.index != null ? stored.index : null;
  } else {
    savedIndexOnLoad = null;
  }

  saveState();
  loadChapter();
};

// Salvar manga para o usuário conectado
document.getElementById('saveMangaBtn').onclick = function(){
  var token = localStorage.getItem('manga_token');
  if(!token){  return }
  var name = document.getElementById('mangaName').value.trim();
  if(!name){ alert('Selecione um manga da lista antes de salvar.'); return }
  var base = document.getElementById('baseUrl').value.trim(); if(!base.endsWith('/')) base += '/';
  var chapter = document.getElementById('chapterNum').value.trim();
  var url = base + 'capitulo-' + chapter;
  fetch('/manga/save?token=' + encodeURIComponent(token), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name: name, url: url, chapter: chapter, index: index})
  }).then(r=>r.json()).then(j=>{
    if(j.ok) alert('Salvo'); else alert(j.detail||'erro');
  }).catch(e=>alert('erro'));
};

// Mostrar lista clicável de mangas salvos no menu
document.getElementById('listMangasBtn').onclick = function(){
  var token = localStorage.getItem('manga_token');
  if(!token){ return }
  document.getElementById('configMenu').style.display = 'flex';
  loadMyMangas();
};

/* -----------------------------
    REABRIR O MENU
------------------------------*/
document.getElementById("menuBtn").onclick = function () {
  document.getElementById("configMenu").style.display = "flex";
};

/* Botão fechar no menu de configuração */
document.getElementById("closeConfigBtn").onclick = function () {
  document.getElementById("configMenu").style.display = "none";
};
</script>

<link rel="stylesheet" href="auth.css">
<script src="auth.js"></script>

</body>
</html>
